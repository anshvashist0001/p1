name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: profiler
          POSTGRES_PASSWORD: local-profiler-dev
          POSTGRES_DB: profiler
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U profiler -d profiler"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-postgres.txt
      - run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql://profiler:local-profiler-dev@127.0.0.1:5432/profiler
